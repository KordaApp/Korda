<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KORDA</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app" class="app-grid">
    <aside id="servers-rail" class="servers-rail">
      <div class="server-logo">K</div>
      <div class="server-item active">BR</div>
      <div class="server-item">FF</div>
      <div class="server-item">CS</div>
      <button class="server-add">+</button>
    </aside>

    <aside id="channels-panel" class="channels-panel">
      <div class="server-header">
        <h2>KORDA BR</h2>
        <span>Servidor de comunidade</span>
      </div>
      <div class="channels-section">
        <h3>CANAIS DE TEXTO</h3>
        <div class="channel active"># geral</div>
        <div class="channel"># anúncios</div>
        <div class="channel"># memes</div>
        <div class="channel"># suporte</div>
      </div>
      <div class="channels-section">
        <h3>CANAIS DE VOZ</h3>
        <div class="channel">🔊 Geral</div>
        <div class="channel">🔊 Jogos</div>
      </div>
    </aside>

    <main id="chat-area" class="chat-area">
      <div class="chat-header">
        <h2># geral</h2>
        <p>Bora trocar uma ideia, mano? 😎</p>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="message">
          <div class="avatar">A</div>
          <div class="msg-body">
            <div class="msg-head">
              <strong>Arthur</strong>
              <span class="time">14:34</span>
            </div>
            <div class="msg-text">Bora, já chamo o pessoal</div>
            <div class="reactions">👍 2 &nbsp; ❤️ 4</div>
          </div>
        </div>
      </div>
      <div class="chat-input">
        <button class="plus">+</button>
        <input type="text" placeholder="Envie uma mensagem em #geral" />
        <button class="emoji">😊</button>
      </div>
    </main>

    <aside id="friends-panel" class="friends-panel">
      <h3>AMIGOS</h3>
      <div class="friend">
        <div class="dot online"></div>
        <div>
          <strong>Lukzinn</strong>
          <small>Jogando Free Fire</small>
        </div>
      </div>
      <div class="friend">
        <div class="dot online"></div>
        <div>
          <strong>zNeto</strong>
          <small>Jogando CS2</small>
        </div>
      </div>
      <div class="friend">
        <div class="dot online"></div>
        <div>
          <strong>Mimi</strong>
          <small>Ouvindo música</small>
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
